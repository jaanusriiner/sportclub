spring.application.name=backend

# PostgreSQL
# P6Spy - settings
# spring.datasource.url=jdbc:p6spy:postgresql://localhost/vali_it
# spring.datasource.driverClassName=com.p6spy.engine.spy.P6SpyDriver

# normal settings
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost/vali_it?currentSchema=sportclub
spring.datasource.username=postgres
spring.datasource.password=student123

# JPA stuff
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Enable SQL initialization
spring.sql.init.mode=always

# Disable Hibernate DDL generation to avoid conflicts
spring.jpa.hibernate.ddl-auto=none

# Google AI
spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${GENAI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite
spring.ai.google.genai.chat.response-mime-type=application/json
spring.ai.google.genai.chat.max-output-tokens=1024

# NL-to-SQL prompt dialect
nlsql.dialect=PostgreSQL