spring.application.name=backend

# PostgreSQL
# P6Spy - settings
# spring.datasource.url=jdbc:p6spy:postgresql://localhost/vali_it
# spring.datasource.driverClassName=com.p6spy.engine.spy.P6SpyDriver

# normal settings
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost/vali_it?currentSchema=sportclub
spring.datasource.username=postgres
spring.datasource.password=student123

# JPA stuff
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Enable SQL initialization
spring.sql.init.mode=always

# Disable Hibernate DDL generation to avoid conflicts
spring.jpa.hibernate.ddl-auto=none

# LLM providerid: Google GenAI, OpenAI ja Anthropic on kõik aktiivsed (spring.ai.model.chat jäetud määramata, muidu
# lülitub sisse ainult üks provider). Mitme ChatModel beaniga ei saa Spring ise ChatClient.Builder'it luua -
# see on välja lülitatud ja builderid tehakse LlmConfig'us (vaikimisi/primary on Gemini).
spring.ai.chat.client.enabled=false

# Google AI
spring.ai.google.genai.api-key=${GENAI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite
spring.ai.google.genai.chat.response-mime-type=application/json
spring.ai.google.genai.chat.max-output-tokens=5000

# OpenAI (Chat Completions API). Võti tuleb keskkonnamuutujast; vaikeväärtus laseb backendil käivituda ka ilma
# võtmeta - siis ebaõnnestuvad ainult OpenAI kutsed (Benchmark-vaates selle mudeli paneelis).
spring.ai.openai.api-key=${OPENAI_API_KEY:not-configured}
spring.ai.openai.chat.model=gpt-4.1-mini

# Anthropic (Messages API, ametlik anthropic-java SDK). max_tokens on Anthropicul kohustuslik ja sisaldab ka
# mõtlemist - 16000 jätab ruumi; vaikeväärtusega võti laseb backendil käivituda ka ilma ANTHROPIC_API_KEY-ta.
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:not-configured}
spring.ai.anthropic.chat.model=claude-haiku-4-5
spring.ai.anthropic.chat.max-tokens=16000

# NL-to-SQL prompt dialect
nlsql.dialect=PostgreSQL

# Benchmark: LLM hinnad on DB-s USD-s, kulu kuvatakse EUR-s
llm.usd-to-eur-rate=0.92
